[package]
name = "EC-Wallet"
version = "1.0.0"
edition = "2024"

[dependencies]
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-secp256k1 = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
dioxus = { version = "=0.7.2", features = ["mobile"] }
hex = "0.4.0"
k256 = { version = "=0.10.0", features = ["ecdsa", "ecdsa-core", "keccak256"] }
rand = "=0.10.0"
reqwest = { version = "=0.11.0", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "=0.10.0"
tokio = { version = "1", features = ["time"] }
zeroize = "1.8"